<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="nixBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5277C3" />
      <stop offset="100%" stop-color="#7EBAE4" />
    </linearGradient>
    <linearGradient id="nixAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BB5EC" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg)" stroke="#5277C3" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Stylized Nix Snowflake Blades -->
  <g transform="translate(128,128)">
    <!-- Arm 1 (Top) -->
    <path d="M 0,-85 L 18,-45 L -18,-45 Z" fill="url(#nixBlue)" />
    <path d="M 0,-45 L 8,-12 L -8,-12 Z" fill="url(#nixAccent)" />

    <!-- Arm 2 (Bottom) -->
    <path d="M 0,85 L 18,45 L -18,45 Z" fill="url(#nixBlue)" />
    <path d="M 0,45 L 8,12 L -8,12 Z" fill="url(#nixAccent)" />

    <!-- Arm 3 (Top Right) -->
    <g transform="rotate(60)">
      <path d="M 0,-85 L 18,-45 L -18,-45 Z" fill="url(#nixBlue)" />
      <path d="M 0,-45 L 8,-12 L -8,-12 Z" fill="url(#nixAccent)" />
    </g>

    <!-- Arm 4 (Bottom Left) -->
    <g transform="rotate(120)">
      <path d="M 0,-85 L 18,-45 L -18,-45 Z" fill="url(#nixBlue)" />
      <path d="M 0,-45 L 8,-12 L -8,-12 Z" fill="url(#nixAccent)" />
    </g>

    <!-- Arm 5 (Top Left) -->
    <g transform="rotate(240)">
      <path d="M 0,-85 L 18,-45 L -18,-45 Z" fill="url(#nixBlue)" />
      <path d="M 0,-45 L 8,-12 L -8,-12 Z" fill="url(#nixAccent)" />
    </g>

    <!-- Arm 6 (Bottom Right) -->
    <g transform="rotate(300)">
      <path d="M 0,-85 L 18,-45 L -18,-45 Z" fill="url(#nixBlue)" />
      <path d="M 0,-45 L 8,-12 L -8,-12 Z" fill="url(#nixAccent)" />
    </g>

    <!-- Core Center Ring -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="7" fill="#0f2027" />
  </g>
</svg>
