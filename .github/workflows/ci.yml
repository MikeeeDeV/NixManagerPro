name: CI / Lint & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Tkinter & Xvfb)
        run: |
          sudo apt update
          sudo apt install -y python3-tk xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m py_compile main.py core/*.py ui/*.py utils/*.py tests/*.py

      - name: Run Pytest Test Suite
        run: |
          xvfb-run -a pytest tests/ -v
